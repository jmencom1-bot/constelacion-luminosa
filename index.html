<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Constelación Luminosa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
/* Concepto: cielo nocturno a pantalla completa. Al encender el sonido, una constelación se dibuja sola, estrella por estrella, y cada una guarda una frase y una nota. */
:root{
  --night:#070b1f;
  --deep:#10173a;
  --glow:#ffe9b8;
  --ice:#bcd6ff;
  --rose:#f2b8d4;
  --ink:#eef2ff;
  --mute:#9aa6cf;
  --neb-rose:rgba(242,184,212,.13);
  --neb-blue:rgba(120,150,255,.15);
  --neb-gold:rgba(255,233,184,.07);
  --line:rgba(255,233,184,.55);
  --fill:rgba(255,233,184,.08);
  --halo:rgba(255,233,184,.35);
  --display:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --body:'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;
  box-sizing:border-box;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  overflow:hidden;
  color:var(--ink);
  font-family:var(--body);
  background-color:var(--night);
  background-image:
    radial-gradient(60% 45% at 22% 28%, var(--neb-rose), transparent 70%),
    radial-gradient(55% 50% at 80% 60%, var(--neb-blue), transparent 70%),
    radial-gradient(90% 55% at 50% 105%, var(--neb-gold), transparent 70%),
    linear-gradient(180deg, var(--night), var(--deep));
}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.ui{
  position:fixed;inset:0;box-sizing:border-box;
  display:flex;flex-direction:column;justify-content:space-between;align-items:center;
  text-align:center;pointer-events:none;
  padding-top:max(22px, env(safe-area-inset-top, 0px));
  padding-bottom:max(24px, env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.eyebrow{margin:0;font-size:12px;font-weight:400;letter-spacing:.3em;text-transform:uppercase;color:var(--mute)}
h1{
  margin:8px 0 0;font-family:var(--display);font-style:italic;font-weight:500;
  font-size:clamp(40px, 10vw, 68px);line-height:1.05;color:var(--glow);
  text-shadow:0 0 28px var(--halo);text-wrap:balance;
}
.foot{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
.caption{
  margin:0;min-height:2.7em;max-width:30ch;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-style:italic;font-size:clamp(20px, 5vw, 26px);line-height:1.3;color:var(--ink);
  text-wrap:balance;
}
.caption.swap{animation:rise .9s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;pointer-events:auto}
.btn{
  appearance:none;cursor:pointer;
  font-family:var(--body);font-size:13px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;
  color:var(--glow);background:var(--fill);
  border:1px solid var(--line);border-radius:999px;padding:14px 26px;
  transition:background .25s ease, box-shadow .25s ease;
}
.btn:hover{background:rgba(255,233,184,.16);box-shadow:0 0 22px var(--halo)}
.btn:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
.btn.quiet{padding:10px 18px;font-size:11px;color:var(--mute);border-color:rgba(154,166,207,.4);background:transparent}
.btn.quiet:hover{color:var(--ink);box-shadow:none;background:rgba(154,166,207,.12)}
@media (prefers-reduced-motion: reduce){
  .caption.swap{animation:none}
}
</style>

<canvas id="sky" aria-label="Cielo estrellado con una constelación"></canvas>

<div class="ui">
  <header>
    <p class="eyebrow">Un cielo hecho a mano</p>
    <h1>Para ti</h1>
  </header>
  <div class="foot">
    <p class="caption" id="caption" aria-live="polite">Un cielo pequeño, con una constelación para ti.</p>
    <div class="row">
      <button class="btn" id="start" type="button">Encender el cielo</button>
      <button class="btn quiet" id="sound" type="button" aria-pressed="false" hidden>Silenciar</button>
    </div>
  </div>
</div>

<script>
(function(){
  var cv = document.getElementById('sky');
  var ctx = cv.getContext('2d');
  var startBtn = document.getElementById('start');
  var soundBtn = document.getElementById('sound');
  var capEl = document.getElementById('caption');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function hexRgb(h){ h = h.replace('#',''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }
  function rgba(c,a){ return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  var cs = getComputedStyle(document.documentElement);
  function tok(n, fb){ var v = cs.getPropertyValue(n).trim(); return v || fb; }
  var GLOW = hexRgb(tok('--glow','#ffe9b8'));
  var ICE  = hexRgb(tok('--ice','#bcd6ff'));
  var ROSE = hexRgb(tok('--rose','#f2b8d4'));
  var WHITE = [255,255,255];

  /* ---------- Constelación ---------- */
  var base = [
    [-0.85, 0.15, 1.0], [-0.55,-0.35, 1.3], [-0.20,-0.10, 1.0], [ 0.05,-0.55, 2.2], [ 0.40,-0.25, 1.4],
    [ 0.80,-0.50, 1.2], [ 0.65, 0.10, 1.0], [ 0.30, 0.35, 1.3], [-0.05, 0.60, 2.0], [-0.40, 0.40, 1.0]
  ];
  var phrases = [
    'Gracias por estar.',
    'Tu risa ilumina cualquier día.',
    'Eres de esas personas que se quedan.',
    'Que nunca te falte luz.',
    'Mereces cosas bonitas.',
    'Lo que sueñas está más cerca de lo que crees.',
    'Contigo todo pesa menos.',
    'Hoy y siempre, un abrazo.',
    'Brillas incluso cuando no lo notas.',
    'Qué suerte cruzarme contigo.'
  ];
  var scale = [72,74,76,79,81,84,86,88,91,93];
  var k = reduce ? 0.4 : 1;
  var starDelay = base.map(function(_, i){ return i * 0.65 * k; });
  var edges = [];
  for (var i = 0; i < 9; i++) edges.push({a:i, b:i+1, delay:(i*0.65+0.25)*k, dur:1.0*k});
  [[9,2],[2,8],[4,7]].forEach(function(e, n){ edges.push({a:e[0], b:e[1], delay:(6.4+n*0.5)*k, dur:1.2*k}); });
  var totalTime = 9 * k;

  var W = 0, H = 0, dpr = 1, P = [], bg = [];
  var ox = 0, oy = 0;
  var px = 0, py = 0, tx = 0, ty = 0;

  function layout(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var sx = Math.min(W * 0.40, 460), sy = Math.min(H * 0.26, 260);
    var cx = W / 2, cy = H * 0.5;
    P = base.map(function(p){ return {x: cx + p[0]*sx, y: cy + p[1]*sy, s: p[2]}; });
    var n = Math.max(120, Math.round(W * H / 4200));
    bg = [];
    var tints = [WHITE, WHITE, ICE, GLOW, ROSE];
    for (var j = 0; j < n; j++){
      var depth = Math.random();
      bg.push({
        x: Math.random(), y: Math.random(), d: depth,
        r: 0.4 + depth * 1.1,
        a0: 0.28 + depth * 0.3, amp: 0.2 + Math.random() * 0.25,
        sp: 0.5 + Math.random() * 1.8, ph: Math.random() * 6.28,
        c: tints[Math.floor(Math.random() * tints.length)]
      });
    }
  }
  window.addEventListener('resize', layout);
  layout();

  if (!reduce){
    window.addEventListener('pointermove', function(e){
      tx = (e.clientX / W - 0.5) * 2; ty = (e.clientY / H - 0.5) * 2;
    });
  }

  /* ---------- Estado ---------- */
  var started = false, t0 = 0, chimed = [], hintShown = false;
  var ripples = [], shooters = [], nextShoot = 0;

  function clamp(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }
  function smooth(p){ return p * p * (3 - 2 * p); }
  function litOf(i, now){ return started ? smooth(clamp((now - t0 - starDelay[i]) / 1.4)) : 0; }

  /* ---------- Dibujo ---------- */
  function drawBg(now){
    for (var i = 0; i < bg.length; i++){
      var s = bg[i];
      var a = s.a0 + s.amp * Math.sin(now * s.sp + s.ph);
      if (a <= 0) continue;
      ctx.fillStyle = rgba(s.c, a);
      ctx.beginPath();
      ctx.arc(s.x * W + px * s.d * 14, s.y * H + py * s.d * 14, s.r, 0, 6.2832);
      ctx.fill();
    }
  }

  function drawEdges(now){
    ctx.lineCap = 'round';
    for (var i = 0; i < edges.length; i++){
      var e = edges[i], A = P[e.a], B = P[e.b];
      ctx.shadowBlur = 0;
      ctx.strokeStyle = rgba(ICE, 0.13);
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(A.x + ox, A.y + oy); ctx.lineTo(B.x + ox, B.y + oy); ctx.stroke();
      var p = started ? smooth(clamp((now - t0 - e.delay) / e.dur)) : 0;
      if (p > 0){
        var pulse = 0.62 + 0.18 * Math.sin(now * 1.3 + i);
        ctx.shadowColor = rgba(GLOW, 0.8);
        ctx.shadowBlur = 10;
        ctx.strokeStyle = rgba(GLOW, pulse);
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(A.x + ox, A.y + oy);
        ctx.lineTo(A.x + (B.x - A.x) * p + ox, A.y + (B.y - A.y) * p + oy);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }
  }

  function drawStar(i, now){
    var p = P[i], g = litOf(i, now);
    var pulse = 0.88 + 0.12 * Math.sin(now * 1.7 + i * 1.3);
    var x = p.x + ox, y = p.y + oy, s = p.s;
    var R = (16 + s * 12) * (0.4 + 0.6 * g) * pulse;
    var grad = ctx.createRadialGradient(x, y, 0, x, y, R);
    grad.addColorStop(0, rgba(GLOW, 0.85 * g + 0.1));
    grad.addColorStop(0.35, rgba(GLOW, 0.25 * g + 0.03));
    grad.addColorStop(1, rgba(GLOW, 0));
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y, R, 0, 6.2832); ctx.fill();
    ctx.fillStyle = rgba(WHITE, 0.55 + 0.45 * g);
    ctx.beginPath(); ctx.arc(x, y, 1.4 + s * 0.9 * (0.6 + 0.4 * g), 0, 6.2832); ctx.fill();
    if (s >= 1.3 && g > 0){
      var L = (10 + s * 10) * g * pulse;
      ctx.strokeStyle = rgba(GLOW, 0.6 * g);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x - L, y); ctx.lineTo(x + L, y);
      ctx.moveTo(x, y - L); ctx.lineTo(x, y + L);
      ctx.stroke();
    }
  }

  function drawRipples(now){
    for (var i = ripples.length - 1; i >= 0; i--){
      var r = ripples[i], k2 = (now - r.t) / 1.8;
      if (k2 >= 1){ ripples.splice(i, 1); continue; }
      ctx.strokeStyle = rgba(ICE, 0.5 * (1 - k2));
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(r.x + ox, r.y + oy, 8 + k2 * 46, 0, 6.2832); ctx.stroke();
    }
  }

  function drawShooters(now){
    if (reduce) return;
    if (started && now > nextShoot){
      var ang = 0.45 + Math.random() * 0.2, sp = 560;
      shooters.push({
        t: now, x: W * (0.4 + Math.random() * 0.6), y: H * Math.random() * 0.35,
        vx: -Math.cos(ang) * sp, vy: Math.sin(ang) * sp, sp: sp, life: 1.1
      });
      nextShoot = now + 4 + Math.random() * 5;
    }
    for (var i = shooters.length - 1; i >= 0; i--){
      var s = shooters[i], age = now - s.t;
      if (age > s.life){ shooters.splice(i, 1); continue; }
      var hx = s.x + s.vx * age, hy = s.y + s.vy * age;
      var tl = 150 * Math.min(1, age / 0.2);
      var ux = s.vx / s.sp, uy = s.vy / s.sp;
      var gx = hx - ux * tl, gy = hy - uy * tl;
      var lg = ctx.createLinearGradient(gx, gy, hx, hy);
      var fade = 1 - age / s.life;
      lg.addColorStop(0, rgba(GLOW, 0));
      lg.addColorStop(1, rgba(WHITE, 0.9 * fade));
      ctx.strokeStyle = lg; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(hx, hy); ctx.stroke();
    }
  }

  function frame(){
    var now = performance.now() / 1000;
    px += (tx - px) * 0.05; py += (ty - py) * 0.05;
    ox = px * 10; oy = py * 10;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    drawBg(now);
    drawShooters(now);
    drawEdges(now);
    for (var i = 0; i < P.length; i++){
      drawStar(i, now);
      if (started && !chimed[i] && now - t0 >= starDelay[i]){
        chimed[i] = true;
        playNote(scale[i % scale.length], 0.8);
      }
    }
    drawRipples(now);
    ctx.globalCompositeOperation = 'source-over';
    if (started && !hintShown && now - t0 > totalTime){
      hintShown = true; say('Toca las estrellas.');
    }
    requestAnimationFrame(frame);
  }

  /* ---------- Texto ---------- */
  function say(t){
    capEl.classList.remove('swap');
    void capEl.offsetWidth;
    capEl.textContent = t;
    capEl.classList.add('swap');
  }

  /* ---------- Audio ---------- */
  var ac = null, master, bus, echoIn, muted = false, audioOk = true;
  function mf(m){ return 440 * Math.pow(2, (m - 69) / 12); }

  function initAudio(){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
      var len = Math.floor(ac.sampleRate * 4);
      var buf = ac.createBuffer(2, len, ac.sampleRate);
      for (var c = 0; c < 2; c++){
        var d = buf.getChannelData(c);
        for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
      }
      var rev = ac.createConvolver(); rev.buffer = buf;
      var wet = ac.createGain(); wet.gain.value = 0.7; rev.connect(wet); wet.connect(master);
      var dry = ac.createGain(); dry.gain.value = 0.7; dry.connect(master);
      bus = ac.createGain(); bus.connect(dry); bus.connect(rev);
      var del = ac.createDelay(1); del.delayTime.value = 0.42;
      var fb = ac.createGain(); fb.gain.value = 0.36;
      echoIn = ac.createGain(); echoIn.gain.value = 0.5;
      echoIn.connect(del); del.connect(fb); fb.connect(del); del.connect(bus);
      master.gain.linearRampToValueAtTime(0.8, ac.currentTime + 4);
      startPad();
      scheduleChimes();
    } catch (err){
      audioOk = false; ac = null;
    }
  }

  function padChord(notes, when, dur){
    notes.forEach(function(m){
      [0, 1].forEach(function(kk){
        var o = ac.createOscillator();
        o.type = kk ? 'triangle' : 'sine';
        o.frequency.value = mf(m);
        o.detune.value = kk ? 6 : -6;
        var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = kk ? 700 : 1400;
        var g = ac.createGain();
        g.gain.setValueAtTime(0, when);
        g.gain.linearRampToValueAtTime(kk ? 0.018 : 0.034, when + dur * 0.35);
        g.gain.linearRampToValueAtTime(0, when + dur * 1.25);
        o.connect(lp); lp.connect(g); g.connect(bus);
        o.start(when); o.stop(when + dur * 1.3);
      });
    });
  }

  function startPad(){
    var chords = [[48,52,55,59],[45,52,55,60],[41,48,52,57],[43,50,57,59]];
    var next = ac.currentTime + 0.2, idx = 0;
    function pump(){
      if (!ac) return;
      while (next < ac.currentTime + 4){
        padChord(chords[idx % chords.length], next, 9);
        next += 8; idx++;
      }
    }
    pump();
    setInterval(pump, 2000);
  }

  function playNote(m, vel){
    if (!ac || muted) return;
    var t = ac.currentTime;
    var o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = mf(m);
    var o2 = ac.createOscillator(); o2.type = 'sine'; o2.frequency.value = mf(m) * 2;
    var g = ac.createGain(), g2 = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.13 * vel, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3.2);
    g2.gain.value = 0.2;
    o.connect(g); o2.connect(g2); g2.connect(g);
    g.connect(bus); g.connect(echoIn);
    o.start(t); o2.start(t); o.stop(t + 3.4); o2.stop(t + 3.4);
  }

  function scheduleChimes(){
    var pos = 3;
    function go(){
      if (!ac) return;
      if (!muted && !document.hidden){
        pos = Math.max(0, Math.min(scale.length - 1, pos + Math.round((Math.random() - 0.5) * 4)));
        playNote(scale[pos] - 12 * (Math.random() < 0.35 ? 1 : 0), 0.55);
      }
      setTimeout(go, 2200 + Math.random() * 3000);
    }
    setTimeout(go, 6500);
  }

  document.addEventListener('visibilitychange', function(){
    if (!ac) return;
    if (document.hidden) ac.suspend(); else ac.resume();
  });

  /* ---------- Interacción ---------- */
  function begin(){
    if (started) return;
    started = true;
    initAudio();
    if (ac && ac.resume) ac.resume();
    t0 = performance.now() / 1000;
    nextShoot = t0 + 5;
    startBtn.hidden = true;
    if (audioOk) soundBtn.hidden = false;
    say('Mira cómo se encienden, una por una.');
  }
  startBtn.addEventListener('click', begin);

  soundBtn.addEventListener('click', function(){
    if (!ac) return;
    muted = !muted;
    master.gain.cancelScheduledValues(ac.currentTime);
    master.gain.setTargetAtTime(muted ? 0 : 0.8, ac.currentTime, 0.3);
    soundBtn.textContent = muted ? 'Activar sonido' : 'Silenciar';
    soundBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
  });

  function starAt(x, y){
    var best = -1, bd = 32 * 32;
    for (var i = 0; i < P.length; i++){
      var dx = x - (P[i].x + ox), dy = y - (P[i].y + oy), d2 = dx * dx + dy * dy;
      if (d2 < bd){ bd = d2; best = i; }
    }
    return best;
  }

  cv.addEventListener('pointerdown', function(e){
    if (!started) return;
    var i = starAt(e.clientX, e.clientY);
    if (i < 0) return;
    playNote(scale[i % scale.length], 1);
    ripples.push({x: P[i].x, y: P[i].y, t: performance.now() / 1000});
    say(phrases[i]);
  });
  cv.addEventListener('pointermove', function(e){
    cv.style.cursor = (started && starAt(e.clientX, e.clientY) >= 0) ? 'pointer' : 'default';
  });

  requestAnimationFrame(frame);
})();
</script>

</body></html>
